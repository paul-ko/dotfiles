repos:
  - repo: local
    hooks:
      - id: selene
        name: lint lua files with selene
        language: unsupported
        entry: selene
        types: [lua]
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
    - id: shellcheck
      args: ["--severity=warning"]
